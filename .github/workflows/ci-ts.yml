name: "CI (TypeScript)"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "22"
      enable-pages-preview:
        description: "Deploy a Pages preview for pull requests"
        type: boolean
        default: false
      coverage-threshold:
        description: "Minimum required line coverage (%)"
        type: number
        default: 80

jobs:
  ci:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (Prettier)
        run: npx prettier --check .

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Test (Vitest with coverage)
        run: npx vitest run --coverage --coverage.thresholds.lines=${{ inputs.coverage-threshold }}

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: false

  pages-preview:
    name: Pages preview (PR only)
    if: ${{ inputs.enable-pages-preview && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with base path
        run: npx vite build --base=/pr-${{ github.event.number }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
