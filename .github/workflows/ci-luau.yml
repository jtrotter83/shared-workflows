name: "CI (Roblox / Luau)"

on:
  workflow_call:
    inputs:
      source-dir:
        description: "Source directory to check with StyLua"
        type: string
        default: "src"

jobs:
  luau-ci:
    name: StyLua, Selene, Rojo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install StyLua
        run: |
          gh release download --repo JohnnyMorganz/StyLua --pattern 'stylua-linux-x86_64.zip' --output stylua.zip
          unzip -o stylua.zip && chmod +x stylua && sudo mv stylua /usr/local/bin/stylua
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Format check (StyLua)
        run: stylua --check ${{ inputs.source-dir }}

      - name: Install Selene
        run: |
          gh release download --repo kampfkarren/selene --pattern 'selene-*-linux.zip' --output selene.zip
          unzip -o selene.zip && chmod +x selene && sudo mv selene /usr/local/bin/selene
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Lint (Selene)
        run: selene ${{ inputs.source-dir }}

      - name: Install Rojo
        run: |
          gh release download --repo rojo-rbx/rojo --pattern 'rojo-*-linux-x86_64.zip' --output rojo.zip
          unzip -o rojo.zip && chmod +x rojo && sudo mv rojo /usr/local/bin/rojo
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build smoke test (Rojo)
        run: |
          project=$(ls default.project.json *.project.json 2>/dev/null | head -n1)
          if [ -z "$project" ]; then
            echo "No .project.json found" >&2
            exit 1
          fi
          rojo build "$project" -o build.rbxl
